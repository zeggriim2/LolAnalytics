name: CD - DevTest

on:
  push:
    branches:
      - develop
  workflow_dispatch: ~

concurrency:
  group: cd-devtest
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 : Build frontend + image PHP → push GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Tag immuable (sha) pour forcer le pull à chaque déploiement
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image tags
        id: meta
        run: |
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_sha=${BASE}:devtest-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=${BASE}:devtest-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${BASE}:devtest"               >> "$GITHUB_ENV"

      # ── Docker (le build frontend est géré par le stage node_build du Dockerfile) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_devtest
          push: true
          # Tag SHA immuable (utilisé par Portainer pour forcer le pull)
          # Tag :devtest pour référence humaine
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha,scope=devtest
          cache-to: type=gha,scope=devtest,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 : Déploiement via API Portainer (aucun SSH requis)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via Portainer API
    runs-on: ubuntu-latest
    needs: build-push
    environment: devtest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy stack via Portainer API
        env:
          # Portainer
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_NAME: lolanalytics-devtest
          # Image avec tag SHA immuable → Portainer tire toujours la nouvelle
          PHP_IMAGE: ${{ needs.build-push.outputs.image_sha }}
          # App
          APP_SECRET: ${{ secrets.DEVTEST_APP_SECRET }}
          DATABASE_URL: ${{ secrets.DEVTEST_DATABASE_URL }}
          API_RIOT_KEY: ${{ secrets.DEVTEST_API_RIOT_KEY }}
          # MySQL
          MYSQL_ROOT_PASSWORD: ${{ secrets.DEVTEST_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DEVTEST_MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.DEVTEST_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.DEVTEST_MYSQL_PASSWORD }}
          # Mercure
          CADDY_MERCURE_JWT_SECRET: ${{ secrets.DEVTEST_MERCURE_JWT_SECRET }}
          # Caddy
          SERVER_NAME: ${{ secrets.DEVTEST_SERVER_NAME }}
          # JWT (keypair auto-généré au 1er démarrage, persisté dans le volume jwt_keys)
          JWT_PASSPHRASE: ${{ secrets.DEVTEST_JWT_PASSPHRASE }}
        run: |
          set -euo pipefail

          # ── Lecture du fichier compose ──────────────────────────────────
          COMPOSE_CONTENT=$(jq -Rs . < compose.devtest.yaml)

          # ── Construction du tableau d'env vars pour l'API Portainer ──────
          # jq --arg passe les valeurs en toute sécurité (gère les caractères spéciaux)
          ENV_JSON=$(jq -n \
            --arg php_image            "${PHP_IMAGE}" \
            --arg app_secret           "${APP_SECRET}" \
            --arg database_url         "${DATABASE_URL}" \
            --arg api_riot             "${API_RIOT_KEY}" \
            --arg mysql_root_pw        "${MYSQL_ROOT_PASSWORD}" \
            --arg mysql_db             "${MYSQL_DATABASE}" \
            --arg mysql_user           "${MYSQL_USER}" \
            --arg mysql_pw             "${MYSQL_PASSWORD}" \
            --arg mercure_jwt          "${CADDY_MERCURE_JWT_SECRET}" \
            --arg server_name          "${SERVER_NAME}" \
            --arg jwt_passphrase       "${JWT_PASSPHRASE}" \
            '[
              {"name": "PHP_IMAGE",                "value": $php_image},
              {"name": "APP_SECRET",               "value": $app_secret},
              {"name": "DATABASE_URL",             "value": $database_url},
              {"name": "API_RIOT_KEY",             "value": $api_riot},
              {"name": "MYSQL_ROOT_PASSWORD",      "value": $mysql_root_pw},
              {"name": "MYSQL_DATABASE",           "value": $mysql_db},
              {"name": "MYSQL_USER",               "value": $mysql_user},
              {"name": "MYSQL_PASSWORD",           "value": $mysql_pw},
              {"name": "CADDY_MERCURE_JWT_SECRET", "value": $mercure_jwt},
              {"name": "SERVER_NAME",              "value": $server_name},
              {"name": "JWT_PASSPHRASE",           "value": $jwt_passphrase}
            ]')

          # -k : ignore le certificat auto-signé de Portainer
          CURL="curl -skf"

          # ── Recherche du stack existant par son nom ───────────────────
          STACKS=$(${CURL} \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks")

          STACK_ID=$(echo "$STACKS" | jq -r \
            --arg name "${PORTAINER_STACK_NAME}" \
            '.[] | select(.Name == $name) | .Id // empty')

          # ── Création ou mise à jour du stack ─────────────────────────
          if [ -z "${STACK_ID}" ]; then
            echo "Stack '${PORTAINER_STACK_NAME}' introuvable → création..."
            ${CURL} -X POST \
              "${PORTAINER_URL}/api/stacks/create/standalone/string?endpointId=${PORTAINER_ENDPOINT_ID}" \
              -H "X-API-Key: ${PORTAINER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"${PORTAINER_STACK_NAME}\",
                \"stackFileContent\": ${COMPOSE_CONTENT},
                \"env\": ${ENV_JSON}
              }"
            echo "Stack créé avec succès."
          else
            echo "Stack '${PORTAINER_STACK_NAME}' trouvé (id=${STACK_ID}) → mise à jour..."
            ${CURL} -X PUT \
              "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
              -H "X-API-Key: ${PORTAINER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{
                \"stackFileContent\": ${COMPOSE_CONTENT},
                \"env\": ${ENV_JSON},
                \"prune\": false,
                \"pullImage\": true
              }"
            echo "Stack mis à jour avec succès."
          fi
