name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build Docker images
        uses: docker/bake-action@v6
        with:
          pull: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      COMPOSE_FILE: compose.yaml:compose.override.yaml:compose.ci.yaml
      MYSQL_ROOT_USER: ${{ secrets.MYSQL_ROOT_USER }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Load Docker images from cache
        uses: docker/bake-action@v6
        with:
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
      -
        name: Start services
        run: docker compose up --wait --no-build
      -
        name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      -
        name: Check HTTPS reachability
        if: false # Remove this line when the homepage is configured, or change the path to check
        run: curl -v --insecure --fail-with-body https://localhost
      -
        name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      -
        name: Show PHP logs on failure
        if: failure()
        run: docker compose logs php
      -
        name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      -
        name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      -
        name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      -
        name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: PHP CS Fixer
        run: docker run --rm -v $(pwd):/project -w /project jakzal/phpqa:php8.4-alpine php-cs-fixer fix --dry-run --diff --verbose
      -
        name: Install PHP dependencies
        run: docker run --rm -v $(pwd):/project -w /project jakzal/phpqa:php8.4-alpine composer install --no-interaction --prefer-dist --ignore-platform-req=ext-amqp
      -
        name: PHPStan
        run: docker run --rm -v $(pwd):/project -w /project jakzal/phpqa:php8.4-alpine phpstan analyse --memory-limit=1G
      -
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      -
        name: Install JS dependencies
        run: corepack enable && yarn install --frozen-lockfile
      -
        name: ESLint
        run: yarn lint
      -
        name: Prettier
        run: yarn format:check
      -
        name: TypeScript
        run: yarn type-check

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0