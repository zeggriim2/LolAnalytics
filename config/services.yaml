# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: 
            - '../src/Domain/Model/*'
            - '../src/Infrastructure/SharedContext/Framework/Symfony/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    
    # Match Bounded Context
    App\Match\Domain\Repository\MatchRepositoryInterface:
        alias: App\Match\Infrastructure\Persistance\Doctrine\Repository\DoctrineMatchRepository

    # GameData Bounded Context
    App\GameData\Domain\Repository\QueueRepositoryInterface:
        alias: App\GameData\Infrastructure\Persistence\Doctrine\Repository\DoctrineQueueRepository

    App\GameData\Domain\Repository\GameModeRepositoryInterface:
        alias: App\GameData\Infrastructure\Persistence\Doctrine\Repository\DoctrineGameModeRepository

    App\GameData\Domain\Repository\GameTypeRepositoryInterface:
        alias: App\GameData\Infrastructure\Persistence\Doctrine\Repository\DoctrineGameTypeRepository

    App\GameData\Domain\Repository\MapRepositoryInterface:
        alias: App\GameData\Infrastructure\Persistence\Doctrine\Repository\DoctrineMapRepository

    App\GameData\Domain\Repository\SeasonRepositoryInterface:
        alias: App\GameData\Infrastructure\Persistence\Doctrine\Repository\DoctrineSeasonRepository

    App\GameData\Application\Port\RiotStaticDataProviderInterface:
        alias: App\GameData\Infrastructure\Client\RiotStaticDataProvider

    # CQRS Buses
    App\SharedContext\Application\Bus\CommandBusInterface:
        alias: App\SharedContext\Infrastructure\Bus\MessengerCommandBus

    App\SharedContext\Application\Bus\QueryBusInterface:
        alias: App\SharedContext\Infrastructure\Bus\MessengerQueryBus

