security:
    password_hashers:
        App\Auth\Infrastructure\Persistence\Doctrine\Entity\AdminUserEntity:
            algorithm: auto

    providers:
        admin_users:
            id: App\Auth\Infrastructure\Security\AdminUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_login:
            pattern: ^/api/admin/auth/login
            stateless: true
            json_login:
                check_path: /api/admin/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api_admin:
            pattern: ^/api/admin
            stateless: true
            jwt: ~

        main:
            lazy: true

    access_control:
        - { path: ^/api/admin/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Auth\Infrastructure\Persistence\Doctrine\Entity\AdminUserEntity:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
