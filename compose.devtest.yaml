# DevTest environment — uses pre-built image from GitHub Container Registry
# Deployed via: .github/workflows/cd-devtest.yml
# On VPS: /opt/lolanalytics-devtest/
# JWT keys: auto-generated via lexik:jwt:generate-keypair, persisted in jwt_keys volume
services:
  php:
    image: ${PHP_IMAGE}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # FrankenPHP écoute en HTTP interne uniquement — Traefik gère le TLS
      SERVER_NAME: ":80"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      API_RIOT_KEY: ${API_RIOT_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f/messages
      MERCURE_URL: http://php/.well-known/mercure
      MERCURE_PUBLIC_URL: https://${SERVER_NAME_PUBLIC}/.well-known/mercure
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
      TRUSTED_HOSTS: "^${SERVER_NAME_PUBLIC}$$"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - jwt_keys:/var/www/html/config/jwt
      - public_images:/app/public/images
    # Plus de ports exposés directement — Traefik s'en charge
    networks:
      - web-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-network
      - traefik.http.routers.lolanalytics.rule=Host(`${SERVER_NAME_PUBLIC}`)
      - traefik.http.routers.lolanalytics.entrypoints=websecure
      - traefik.http.routers.lolanalytics.tls.certresolver=letsencrypt
      - traefik.http.services.lolanalytics.loadbalancer.server.port=80
      - traefik.http.routers.lolanalytics.middlewares=secure-headers@docker

  worker:
    image: ${PHP_IMAGE}
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      API_RIOT_KEY: ${API_RIOT_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f/messages
      MERCURE_URL: http://php/.well-known/mercure
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
    volumes:
      - jwt_keys:/var/www/html/config/jwt
      - public_images:/app/public/images
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
      - web-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-network
      - traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.zeggriim.fr`)
      - traefik.http.routers.rabbitmq.entrypoints=websecure
      - traefik.http.routers.rabbitmq.tls.certresolver=letsencrypt
      - traefik.http.services.rabbitmq.loadbalancer.server.port=15672   # ← port management
      - traefik.http.routers.rabbitmq.middlewares=secure-headers@docker,authelia@docker

  database:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    # Plus de port exposé publiquement — accès interne uniquement
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 512M
    networks:
      - web-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web-network
      - traefik.http.routers.phpmyadmin.rule=Host(`pma.zeggriim.fr`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.tls.certresolver=letsencrypt
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80
      - traefik.http.routers.phpmyadmin.middlewares=secure-headers@docker,authelia@docker

volumes:
  caddy_data:
  caddy_config:
  database_data:
  jwt_keys:
  rabbitmq_data:
  public_images:

networks:
  web-network:
    external: true
  internal:
    driver: bridge
